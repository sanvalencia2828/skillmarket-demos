services:
  - type: web
    name: gmgn-aitrader
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PUBLIC_DEMO
        value: "0"
      - key: HOST
        value: "0.0.0.0"
    healthCheckPath: /api/status
    autoDeploy: true
